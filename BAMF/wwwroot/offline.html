<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Can't reach BAMF</title>
<link rel="icon" type="image/svg+xml" href="/bamf-icon.svg">
<meta name="theme-color" content="#10141a">
<style>
  :root { --bg: #10141a; --text: #d5dde8; --dim: #7e8b9d; --accent: #3fdb7f; --line: #263040; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 28rem; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.4rem; margin: 16px 0 8px; }
  p { color: var(--dim); margin: 0 0 12px; }
  button { margin-top: 12px; min-height: 48px; padding: 0 24px; border-radius: 8px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/bamf-icon.svg" alt="" width="72" height="72">
  <h1>Can't reach BAMF</h1>
  <p>The server isn't answering. Check that this phone is on the same network as the BAMF machine, or connected to your VPN, and that BAMF is running.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
