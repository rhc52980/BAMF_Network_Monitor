<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" role="img" aria-label="BAMF — Basic ARP Monitoring Framework">
  <!-- dark panel so the logo previews correctly; delete this rect for transparent use -->
  <rect x="0" y="0" width="460" height="130" rx="14" fill="#10141a"/>

  <!-- comic burst mark -->
  <g transform="translate(8,5)">
    <polygon fill="#3fdb7f" stroke="#0c3a22" stroke-width="3" stroke-linejoin="round"
      points="117,60 93.3,73.8 98.2,98.2 73.8,93.3 60,117 46.2,93.3 19.8,101.2 26.7,73.8 3,60 26.7,46.2 21.8,19.8 46.2,26.7 60,3 73.8,26.7 101.2,19.8 93.3,46.2"/>
    <!-- inner echo line for comic depth -->
    <polygon fill="none" stroke="#0c3a22" stroke-width="2" opacity="0.35" stroke-linejoin="round"
      points="103,60 86,69.9 89.5,87.4 72,83.9 60,103 50.1,86 31.2,91.6 36.1,69.9 17,60 36.1,50.1 32.6,31.2 50.1,34 60,17 69.9,34 88.8,31.2 86,50.1"/>
    <!-- network glyph: three nodes, two hops -->
    <line x1="42" y1="72" x2="60" y2="48" stroke="#0c3a22" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="48" x2="78" y2="72" stroke="#0c3a22" stroke-width="5" stroke-linecap="round"/>
    <circle cx="42" cy="72" r="7.5" fill="#0c3a22"/>
    <circle cx="60" cy="48" r="7.5" fill="#0c3a22"/>
    <circle cx="78" cy="72" r="7.5" fill="#ffb454" stroke="#0c3a22" stroke-width="3"/>
  </g>

  <!-- wordmark -->
  <text x="148" y="80" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900"
        font-size="60" letter-spacing="4" fill="#3fdb7f">BAMF</text>

  <!-- tagline -->
  <text x="151" y="106" font-family="Consolas, Menlo, monospace" font-size="13.5"
        letter-spacing="2.5" fill="#7e8b9d">BASIC ARP MONITORING FRAMEWORK</text>
</svg>
